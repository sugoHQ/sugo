# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the AppImages (x86_64 and aarch64, each on a runner of its architecture), starts each
# without a display, and keeps them as the artifacts "sugo-appimage-x86_64" and
# "sugo-appimage-aarch64". Used by release.yml (stable releases) and nightly.yml.
#
# The aarch64 build is not blocking yet: when it fails this workflow still succeeds, and the
# release or nightly goes out without it (its feed then has no "linux-aarch64" entry, so the arm64
# AppImages only report the update).
name: AppImage

on:
  workflow_call:
    inputs:
      version:
        description: The version the program shows and compares when it looks for updates
        required: true
        type: string
      ref:
        description: The commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest system the AppImage is meant for (glibc 2.35), pinned like the actions.
          - arch: x86_64
            runner: ubuntu-24.04
            # ubuntu:22.04
            image: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          # qt.io builds its arm64 Qt on Ubuntu 24.04 (it needs glibc 2.38 and GCC 13's
          # libstdc++), so that is the oldest system this one runs on (glibc 2.39).
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # ubuntu:24.04
            image: ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Read the pinned versions
        id: pins
        run: |
          for pin in QT_VERSION AQT_VERSION ECM_TAG LINUXDEPLOY_TAG LINUXDEPLOY_QT_TAG; do
            value=$(sed -n "s/^$pin=//p" packaging/appimage/build.sh)
            test -n "$value"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      # Qt, extra-cmake-modules and linuxdeploy, where build.sh looks for them before downloading
      # (it checks linuxdeploy's SHA-256 either way).
      - name: Restore Qt, extra-cmake-modules and linuxdeploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/sugo-appimage/qt
            ~/sugo-appimage/ecm
            ~/sugo-appimage/linuxdeploy*.AppImage
          key: appimage-deps-${{ matrix.arch }}-qt${{ steps.pins.outputs.QT_VERSION }}-aqt${{ steps.pins.outputs.AQT_VERSION }}-ecm${{ steps.pins.outputs.ECM_TAG }}-ld${{ steps.pins.outputs.LINUXDEPLOY_TAG }}-ldqt${{ steps.pins.outputs.LINUXDEPLOY_QT_TAG }}

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          WORK="$HOME/sugo-appimage" bash packaging/appimage/build.sh "$VERSION" "$GITHUB_WORKSPACE/out"

      - name: Start it without a display
        working-directory: out
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          "./Sugo-$ARCH.AppImage" --appimage-extract >/dev/null
          test "$(QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --version 2>/dev/null)" = "sugo $VERSION"
          for page in "" timer settings about; do
            bash ../tests/smoke_app.sh squashfs-root/AppRun $page
          done
          rm -rf squashfs-root

      - name: Keep the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sugo-appimage-${{ matrix.arch }}
          path: out/Sugo-${{ matrix.arch }}.AppImage
          if-no-files-found: error
