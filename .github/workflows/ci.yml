name: CI

# dev (daily work), testing (the nightly builds) and main (tested, the releases): see
# "Branches" in docs/DEVELOPMENT.md.
on:
  push:
    branches:
      - dev
      - testing
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
      - 'LICENSES/**'
      - '.gitignore'
  pull_request:
    branches:
      - dev
      - testing
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
      - 'LICENSES/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skips the jobs a change cannot affect: documentation runs nothing, a macOS-only change only the
  # macOS job, a Linux-only one (D-Bus services, metadata) only the Linux jobs. The file lists are
  # in .github/scripts/ci-changes.sh; when the changed files cannot be known, everything runs.
  # A pull request is compared with its base; a push with the commit of the newest run on its
  # branch that passed, so the changes of a failed or cancelled run are tested by the next one.
  changes:
    name: Changes
    # A pull request from dev, testing or main of this repository (e.g. dev into testing) is the
    # same commit the push run already tests: skip it, so the same jobs do not run twice. The name
    # of the branch alone does not say so: the dev or main of a fork was never pushed here, no run
    # has tested it, and its pull request runs like any other. The jobs below need this one.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["dev","testing","main"]'), github.head_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read to find the newest CI run of the branch that passed.
    permissions:
      contents: read
      actions: read
    outputs:
      linux: ${{ steps.detect.outputs.linux }}
      clang: ${{ steps.detect.outputs.clang }}
      macos: ${{ steps.detect.outputs.macos }}
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Detect the jobs to run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            bash .github/scripts/ci-changes.sh --last-green "$BRANCH" "$HEAD"
          else
            bash .github/scripts/ci-changes.sh "$BASE" "$HEAD"
          fi

  # The system the Linux jobs run in: .github/ci-image/Dockerfile, every build dependency installed,
  # on ghcr.io tagged with a hash of the Dockerfile. Built and pushed only when that tag is missing,
  # i.e. the first time after the Dockerfile changes; otherwise a check of a few seconds.
  image:
    name: CI image
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["dev","testing","main"]'), github.head_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Check out the Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci-image
          sparse-checkout-cone-mode: false

      - name: Name the image
        id: name
        run: |
          tag=$(sha256sum .github/ci-image/Dockerfile | cut -c1-16)
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sugo-ci:$tag" >> "$GITHUB_OUTPUT"

      - name: Build the image if it is missing
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE is already there"
            exit 0
          fi
          docker build --pull --tag "$IMAGE" .github/ci-image
          docker push "$IMAGE"

  build-and-test:
    needs: [changes, image]
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    # Reading the image: under an organization a new package is private.
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # The runner's user id, the owner of the workspace (see the Dockerfile).
      options: --user 1001
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate metadata
        run: |
          appstreamcli validate --no-net data/stream.sugo.app.metainfo.xml
          desktop-file-validate data/stream.sugo.app.desktop

      # The compiler cache of the newest run on this branch, else on the branch a pull request
      # targets, else on main (the branches a run may read caches from): only what changed recompiles.
      # "image" in the name: a cache saved outside the container does not unpack inside it.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-image-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-image-${{ github.ref_name }}-
            ccache-image-${{ github.base_ref || 'main' }}-
            ccache-image-main-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Validate the generated runner definition
        run: desktop-file-validate build/stream.sugo.app.runner.desktop

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats
          # Keep only what this build used: the cache stays the size of one build.
          ccache --evict-older-than 7200s

      - name: Install to a temporary prefix
        run: cmake --install build --prefix "$RUNNER_TEMP/sugo-install"

      # One test per core (the tests sharing a folder hold a RESOURCE_LOCK, see tests/CMakeLists.txt).
      - name: Run test suite
        run: ctest --test-dir build --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"

  # Clang's warnings are close to those of Apple's compiler: they show up here before the macOS job,
  # and the tests run again on what it built.
  build-clang:
    name: Build with Clang
    needs: [changes, image]
    if: needs.changes.outputs.clang == 'true'
    runs-on: ubuntu-24.04
    # Reading the image: under an organization a new package is private.
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # The runner's user id, the owner of the workspace (see the Dockerfile).
      options: --user 1001
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-clang-image-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-clang-image-${{ github.ref_name }}-
            ccache-clang-image-${{ github.base_ref || 'main' }}-
            ccache-clang-image-main-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats
          # Keep only what this build used: the cache stays the size of one build.
          ccache --evict-older-than 7200s

      # The suite again, built by another compiler: what one of them gets wrong shows up here.
      - name: Run test suite
        run: ctest --test-dir build --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"

  # Native arm64 build and tests with Qt from qt.io, extra-cmake-modules and libsodium from source,
  # at the versions packaging/macos/build.sh and build-libsodium.sh pin. Not blocking yet: a
  # failure here does not fail CI (nor stop the nightly build) while the port settles.
  # On GitHub's xcode-27 image (macOS 27, in preview), the system the port is tried on.
  build-and-test-macos:
    name: Build and test on macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: xcode-27
    continue-on-error: true
    env:
      CCACHE_VERSION: 4.14.2
      CCACHE_SHA256: cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        id: pins
        run: |
          for pin in QT_VERSION AQT_VERSION ECM_TAG ECM_COMMIT; do
            value=$(sed -n "s/^$pin=//p" packaging/macos/build.sh)
            test -n "$value"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done
          value=$(sed -n "s/^LIBSODIUM_VERSION=//p" packaging/macos/build-libsodium.sh)
          test -n "$value"
          echo "LIBSODIUM_VERSION=$value" >> "$GITHUB_OUTPUT"

      - name: Restore Qt, extra-cmake-modules and libsodium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sugo-deps
          key: macos-deps-${{ runner.arch }}-qt${{ steps.pins.outputs.QT_VERSION }}-aqt${{ steps.pins.outputs.AQT_VERSION }}-ecm${{ steps.pins.outputs.ECM_TAG }}-sodium${{ steps.pins.outputs.LIBSODIUM_VERSION }}

      # ccache from its own release, not Homebrew (which installs it and four libraries at every run).
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sugo-tools
          key: macos-tools-ccache${{ env.CCACHE_VERSION }}

      - name: Install build dependencies
        env:
          QT_VERSION: ${{ steps.pins.outputs.QT_VERSION }}
          AQT_VERSION: ${{ steps.pins.outputs.AQT_VERSION }}
          ECM_TAG: ${{ steps.pins.outputs.ECM_TAG }}
          ECM_COMMIT: ${{ steps.pins.outputs.ECM_COMMIT }}
        run: |
          command -v ninja >/dev/null || brew install ninja
          command -v pkg-config >/dev/null || brew install pkgconf
          ccache_dir=~/sugo-tools/ccache-$CCACHE_VERSION-darwin
          if [ ! -x "$ccache_dir/ccache" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ccache.tar.gz" \
              "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-darwin.tar.gz"
            echo "$CCACHE_SHA256  $RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
            mkdir -p ~/sugo-tools
            tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C ~/sugo-tools
          fi
          echo "$ccache_dir" >> "$GITHUB_PATH"
          # Where the cache step looks (ccache's own default here is ~/Library/Caches/ccache).
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          # GNU timeout, which the smoke tests use.
          command -v timeout >/dev/null || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          deps=~/sugo-deps
          if [ ! -d "$deps/qt/$QT_VERSION" ]; then
            python3 -m venv "$RUNNER_TEMP/aqt"
            "$RUNNER_TEMP/aqt/bin/pip" install -q "aqtinstall==$AQT_VERSION"
            "$RUNNER_TEMP/aqt/bin/python" -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m qtmultimedia -O "$deps/qt" >/dev/null
          fi
          if [ ! -d "$deps/ecm" ]; then
            git clone -q --depth 1 --branch "$ECM_TAG" https://invent.kde.org/frameworks/extra-cmake-modules.git "$RUNNER_TEMP/ecm-src"
            test "$(git -C "$RUNNER_TEMP/ecm-src" rev-parse HEAD)" = "$ECM_COMMIT"
            cmake -S "$RUNNER_TEMP/ecm-src" -B "$RUNNER_TEMP/ecm-build" -G Ninja -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF \
              -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF -DCMAKE_INSTALL_PREFIX="$deps/ecm" >/dev/null
            cmake --install "$RUNNER_TEMP/ecm-build" >/dev/null
          fi
          # aqt names the folder "macos" from Qt 6.7 on, "clang_64" before.
          for qt in "$deps/qt/$QT_VERSION/macos" "$deps/qt/$QT_VERSION/clang_64"; do
            if [ -d "$qt" ]; then echo "SUGO_QT=$qt" >> "$GITHUB_ENV"; break; fi
          done
          echo "SUGO_ECM=$deps/ecm" >> "$GITHUB_ENV"
          # libsodium as the release build has it (universal, static), found through pkg-config.
          bash packaging/macos/build-libsodium.sh "$deps/sodium"
          echo "PKG_CONFIG_PATH=$deps/sodium/lib/pkgconfig" >> "$GITHUB_ENV"
          test "$(PKG_CONFIG_PATH="$deps/sodium/lib/pkgconfig" pkg-config --variable=libdir libsodium)" = "$deps/sodium/lib"

      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.base_ref || 'main' }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Configure
        run: |
          test -n "${SUGO_QT:-}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$SUGO_QT;$SUGO_ECM" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats
          ccache --evict-older-than 7200s

      # One test per core (the tests sharing a folder hold a RESOURCE_LOCK, see tests/CMakeLists.txt).
      - name: Run test suite
        run: ctest --test-dir build --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"
