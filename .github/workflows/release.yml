# SPDX-License-Identifier: GPL-3.0-or-later
# A version tag publishes a release: the AppImages with stable.json (the feed the program's update
# check reads on the stable channel, see src/core/UpdateChecker.h), the Flatpak bundles (x86_64 and
# aarch64) and, when its build succeeded, the macOS disk image.
name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-nightly.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Third-party actions and the build image are pinned to a commit / digest (the version is in
  # the comment): a moved tag cannot change what runs with --privileged or near the release token.
  # Dependabot (.github/dependabot.yml) proposes the updates.
  check:
    name: Verify release target
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the next check needs to know whether main contains the tagged commit.
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Releases are tagged on main (docs/DEVELOPMENT.md): a tag on dev, testing or a stray
          # branch would otherwise be built and published as the latest stable release.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Read the project version
        id: version
        run: echo "version=$(sed -n 's/^project(Sugo VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(sed -n 's/^project(Sugo VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          METAINFO_VERSION=$(grep -o -m1 '<release version="[^"]*"' data/stream.sugo.app.metainfo.xml | sed 's/.*version="\([^"]*\)"/\1/')
          echo "tag: $TAG_VERSION, CMakeLists.txt: $CMAKE_VERSION, metainfo: $METAINFO_VERSION"
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $CMAKE_VERSION) in CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$METAINFO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest <release> ($METAINFO_VERSION) in the metainfo"
            exit 1
          fi

  # A version tag always means a release: every tag is built, tested and published (or fails
  # visibly), whatever the tagged commit changed.
  test:
    name: Build and test
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream cmake ninja-build g++ dbus-daemon dbus-bin \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-svg-plugins qt6-multimedia-dev libqt6sql6-sqlite extra-cmake-modules libsodium-dev pkgconf

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

  build-flatpak:
    name: Build Flatpak bundle (${{ matrix.arch }})
    # Runs alongside the tests; publish-release still waits for both. Each architecture builds on
    # a runner of its own (the image has both). Both are blocking.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      # kde-6.11
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: stream.sugo.app.yml
          branch: stable
          arch: ${{ matrix.arch }}
          bundle: sugo-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          artifact-name: sugo-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          cache-key: sugo-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}

  appimage:
    needs: check
    uses: ./.github/workflows/appimage.yml
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ github.sha }}

  # Not blocking yet: the release is published without it when it fails.
  macos:
    needs: check
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ github.sha }}

  publish-release:
    name: Publish GitHub release
    needs: [check, test, build-flatpak, appimage, macos]
    # A manual run on a branch only builds the bundle (downloadable as an artifact);
    # releases are made from version tags alone. Waits for the macOS build but does not need it.
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled()
      && needs.check.result == 'success' && needs.test.result == 'success'
      && needs.build-flatpak.result == 'success' && needs.appimage.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the tag (for the notes in the metainfo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Those of both architectures (a missing one fails the build jobs, so this job would not run).
      - name: Download the Flatpak bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sugo-${{ github.ref_name }}-*
          merge-multiple: true
          path: release-assets

      - name: Download the AppImages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sugo-appimage-*
          merge-multiple: true
          path: release-assets

      - name: Download the macOS disk image
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sugo-macos
          path: release-assets

      # Every file carries the version, the same way for each package: the release page shows
      # which one it is, and so does the file once downloaded. The feed carries the full address,
      # so the installed programs follow any name.
      - name: Name the files after the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: release-assets
        run: |
          mv Sugo-x86_64.AppImage "Sugo-$VERSION-x86_64.AppImage"
          mv "sugo-$GITHUB_REF_NAME-x86_64.flatpak" "Sugo-$VERSION-x86_64.flatpak"
          mv Sugo-aarch64.AppImage "Sugo-$VERSION-aarch64.AppImage"
          mv "sugo-$GITHUB_REF_NAME-aarch64.flatpak" "Sugo-$VERSION-aarch64.flatpak"
          if [ -f Sugo-macOS-universal.dmg ]; then
            mv Sugo-macOS-universal.dmg "Sugo-$VERSION-macOS-universal.dmg"
          fi
          ls -l

      # The addresses in the feed keep the project's path from before it moved to sugoHQ: GitHub
      # redirects it, and Sugo 1.0.2 and older download only from MineraleYT/sugo.
      - name: Write the stable feed
        env:
          REPO: MineraleYT/sugo
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: release-assets
        run: |
          file=Sugo-$VERSION-x86_64.AppImage
          jq -n --arg version "$VERSION" \
                --arg url "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$file" \
                --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                --argjson size "$(stat -c %s "$file")" \
                --arg page "https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME" \
                '{version: $version, url: $url, sha256: $sha256, size: $size, page: $page}' > stable.json
          # The top-level keys are the x86_64 AppImage, as for every installed version. The arm64
          # AppImage under its own key: the x86_64 ones never read it, and the arm64 ones read
          # nothing else.
          arm=Sugo-$VERSION-aarch64.AppImage
          jq --arg url "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$arm" \
             --arg sha256 "$(sha256sum "$arm" | cut -d' ' -f1)" \
             --argjson size "$(stat -c %s "$arm")" \
             '. + {"linux-aarch64": {url: $url, sha256: $sha256, size: $size}}' stable.json > stable.json.new
          mv stable.json.new stable.json
          # The disk image, when it was built, under its own key: the AppImages read only the others.
          dmg=Sugo-$VERSION-macOS-universal.dmg
          if [ -f "$dmg" ]; then
            jq --arg url "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$dmg" \
               --arg sha256 "$(sha256sum "$dmg" | cut -d' ' -f1)" \
               --argjson size "$(stat -c %s "$dmg")" \
               '. + {macos: {url: $url, sha256: $sha256, size: $size}}' stable.json > stable.json.new
            mv stable.json.new stable.json
          fi
          cat stable.json

      # Each entry of the feed signed with the key that is not in the repository (the programs
      # check it against packaging/update-public-key.txt); without the key set there, unsigned.
      - name: Sign the stable feed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        working-directory: release-assets
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/sign-update-feed.sh" stable.json
          cat stable.json

      # The feed must never announce a file that is not there, nor be missing. A new release gets
      # it with the other assets: gh creates the release as a draft, uploads everything, then
      # publishes it, so the files and the feed appear together. The release is the "latest" one,
      # so releases/latest/download/stable.json points to it. A re-run removes the feed first (the
      # rebuilt files have other checksums) and puts it back last.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: release-assets
        run: |
          dmg=Sugo-$VERSION-macOS-universal.dmg
          assets=("Sugo-$VERSION-x86_64.AppImage" "Sugo-$VERSION-x86_64.flatpak"
                  "Sugo-$VERSION-aarch64.AppImage" "Sugo-$VERSION-aarch64.flatpak")
          if [ -f "$dmg" ]; then
            assets+=("$dmg")
          fi
          # "Highlights" from this version's <release> in the metainfo (its lead and its list),
          # put before the generated notes of a new release. How to open the macOS app on the
          # first launch is in docs/USAGE.md, not in the notes.
          VERSION="$VERSION" python3 -I - ../data/stream.sugo.app.metainfo.xml > notes.md <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          version = os.environ["VERSION"]
          for rel in ET.parse(sys.argv[1]).getroot().iter("release"):
              if rel.get("version") != version:
                  continue
              desc = rel.find("description")
              lead = desc.find("p") if desc is not None else None
              items = [" ".join("".join(li.itertext()).split()) for li in rel.iter("li")]
              if items:
                  print("## Highlights\n")
                  if lead is not None:
                      print(" ".join("".join(lead.itertext()).split()) + "\n")
                  for item in items:
                      print("- " + item)
                  print()
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, updating its assets..."
            # Missing on a release whose earlier run failed before the feed: nothing to remove then.
            gh release delete-asset "$GITHUB_REF_NAME" stable.json --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$GITHUB_REF_NAME" stable.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" stable.json --repo "$GITHUB_REPOSITORY" --title "Sugo $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --latest
          fi
